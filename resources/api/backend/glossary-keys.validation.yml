post:
    key:
        - NotBlank: ~
        - Length:
              max: 255

    translations:
        - Optional:
              constraints:
                  - All:
                        constraints:
                            - Collection:
                                  allowMissingFields: true
                                  fields:
                                      localeName:
                                          - NotBlank: ~
                                      value:
                                          - NotBlank: ~

patch:
    translations:
        - Optional:
              constraints:
                  - All:
                        constraints:
                            - Collection:
                                  allowMissingFields: true
                                  fields:
                                      localeName:
                                          - NotBlank: ~
                                      value:
                                          - Optional:
                                                constraints:
                                                    - Length:
                                                          min: 1
